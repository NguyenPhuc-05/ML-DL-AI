name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  identity-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: identity_service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -v

  iris-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Du_an_1_Iris_SVM/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Du_an_1_Iris_SVM/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH="${GITHUB_WORKSPACE}" python -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check Du_an_1_Iris_SVM/frontend/script.js

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no leaked secrets or hardcoded passwords
        run: |
          if grep -rn "identity_service_secret_key\|Admin@ML2024" --include=*.py --include=*.yaml --include=*.yml --include=*.md --include=*.example .; then
            echo "Security violation: found hardcoded default secret or password!"
            exit 1
          fi
