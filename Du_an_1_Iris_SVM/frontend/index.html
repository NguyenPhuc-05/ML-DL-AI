<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris AI Predictor — Dự đoán loài hoa Iris</title>
    <meta name="description" content="Ứng dụng AI sử dụng mô hình SVM để dự đoán loài hoa Iris dựa trên kích thước đài hoa và cánh hoa.">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Nền trang trí nhẹ -->
    <div class="mesh-bg" aria-hidden="true">
        <div class="color-blob blob-1"></div>
        <div class="color-blob blob-2"></div>
        <div class="color-blob blob-3"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="avatar-container">
                <img src="assets/avatar.jpg" alt="Ảnh đại diện nhà phát triển" class="avatar" width="75" height="75">
                <div class="status-indicator" id="status-indicator" title="Đang kiểm tra API...">
                    <span class="sr-only" id="status-text">Đang kiểm tra API</span>
                </div>
            </div>
            <div class="title-container">
                <h1>Iris AI Predictor</h1>
                <p>Dự đoán loài hoa bằng SVM &amp; FastAPI</p>
            </div>
        </header>

        <!-- Nội dung chính -->
        <main class="main-card glass-panel">
            <div class="card-header">
                <h2>Thông số của hoa</h2>
                <p>Nhập các thông số để AI dự đoán loài hoa Iris.</p>
            </div>

            <form id="prediction-form" novalidate>
                <div class="input-grid">
                    <div class="input-group">
                        <label for="sepal-length">Chiều dài đài hoa</label>
                        <span class="input-hint" id="sepal-length-help">4.0 – 8.0 cm</span>
                        <input type="number" id="sepal-length" name="sepal_length" inputmode="decimal"
                               step="0.1" min="4.0" max="8.0" value="5.1" placeholder="VD: 5.1"
                               aria-describedby="sepal-length-help sepal-length-error" required>
                        <span class="input-error" id="sepal-length-error" role="alert" hidden></span>
                    </div>
                    <div class="input-group">
                        <label for="sepal-width">Chiều rộng đài hoa</label>
                        <span class="input-hint" id="sepal-width-help">2.0 – 5.0 cm</span>
                        <input type="number" id="sepal-width" name="sepal_width" inputmode="decimal"
                               step="0.1" min="2.0" max="5.0" value="3.5" placeholder="VD: 3.5"
                               aria-describedby="sepal-width-help sepal-width-error" required>
                        <span class="input-error" id="sepal-width-error" role="alert" hidden></span>
                    </div>
                    <div class="input-group">
                        <label for="petal-length">Chiều dài cánh hoa</label>
                        <span class="input-hint" id="petal-length-help">1.0 – 7.0 cm</span>
                        <input type="number" id="petal-length" name="petal_length" inputmode="decimal"
                               step="0.1" min="1.0" max="7.0" value="1.4" placeholder="VD: 1.4"
                               aria-describedby="petal-length-help petal-length-error" required>
                        <span class="input-error" id="petal-length-error" role="alert" hidden></span>
                    </div>
                    <div class="input-group">
                        <label for="petal-width">Chiều rộng cánh hoa</label>
                        <span class="input-hint" id="petal-width-help">0.1 – 3.0 cm</span>
                        <input type="number" id="petal-width" name="petal_width" inputmode="decimal"
                               step="0.1" min="0.1" max="3.0" value="0.2" placeholder="VD: 0.2"
                               aria-describedby="petal-width-help petal-width-error" required>
                        <span class="input-error" id="petal-width-error" role="alert" hidden></span>
                    </div>
                </div>

                <!-- Preset mẫu -->
                <div class="preset-bar">
                    <span class="preset-label">Dữ liệu mẫu:</span>
                    <button type="button" class="preset-btn" data-preset="setosa">Setosa</button>
                    <button type="button" class="preset-btn" data-preset="versicolor">Versicolor</button>
                    <button type="button" class="preset-btn" data-preset="virginica">Virginica</button>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    <span class="btn-text" id="btn-text">🌸 Dự đoán loài hoa</span>
                    <span class="loader" id="loader" role="status" aria-label="Đang phân tích">
                        <span class="sr-only">Đang phân tích...</span>
                    </span>
                </button>
            </form>

            <!-- Thông báo lỗi trong trang -->
            <div id="error-message" class="error-message" role="alert" aria-live="assertive" hidden></div>

            <!-- Khu vực kết quả -->
            <section id="result-container" class="result-container" aria-live="polite" aria-atomic="true" hidden>
                <div class="result-box" id="result-box">
                    <h3 class="result-title">Kết quả dự đoán</h3>
                    <div class="species-badge" id="species-badge"></div>
                </div>
                <div class="flower-details" id="flower-details">
                    <img src="" alt="Hình ảnh hoa Iris" id="flower-image" class="flower-image" loading="lazy">
                    <div class="flower-info">
                        <h4 id="flower-title"></h4>
                        <div id="flower-content" class="flower-content"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
