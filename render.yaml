services:
  # --- DỰ ÁN 1: IRIS SVM ---
  - type: web
    name: iris-svm-api
    plan: free
    rootDir: Du_an_1_Iris_SVM/backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://iris-svm-frontend-6s3t.onrender.com,http://localhost:5500,http://127.0.0.1:5500

  - type: web
    name: iris-svm-frontend
    rootDir: Du_an_1_Iris_SVM/frontend
    env: static
    buildCommand: echo "No build needed"
    staticPublishPath: .
    autoDeploy: true

  # --- DỰ ÁN 2: BREAST CANCER SVM ---
  - type: web
    name: breast-cancer-svm-api
    plan: free
    rootDir: Du_an_2_Breast_Cancer/backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://breast-cancer-svm-frontend.onrender.com,http://localhost:5500,http://127.0.0.1:5500

  - type: web
    name: breast-cancer-svm-frontend
    rootDir: Du_an_2_Breast_Cancer/frontend
    env: static
    buildCommand: echo "No build needed"
    staticPublishPath: .
    autoDeploy: true

