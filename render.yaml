services:
  - type: web
    name: iris-svm-api
    plan: free
    rootDir: "Du_an_1_Iris_SVM"
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: iris-svm-frontend
    rootDir: "Du_an_1_Iris_SVM/frontend"
    env: static
    buildCommand: "echo 'No build needed'"
    staticPublishPath: "."
